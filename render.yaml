services:
  - type: web
    name: keep-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: ENVIRONMENT
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: CHROMA_PATH
        value: /tmp/keepai/chroma
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        value: ^https://keep-ai-app(?:-git-main)?-nelproghub-bits-projects\.vercel\.app$
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: 495955126205-jfajsdml27qi172pfc88ub5hed20pd16.apps.googleusercontent.com
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:notifications@keepai-app.vercel.app
