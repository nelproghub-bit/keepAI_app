<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6"/>

  <!-- Neural Academic Orbit / Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" stroke-dasharray="12 8"/>
  <circle cx="360" cy="152" r="12" fill="#38bdf8"/>
  <circle cx="152" cy="360" r="9" fill="#a78bfa"/>

  <!-- Central Spark Star (✦ KeepAI emblem) -->
  <g filter="url(#glow)">
    <path d="M 256 96 
             C 256 186 270 200 360 200 
             C 270 200 256 214 256 304 
             C 256 214 242 200 152 200 
             C 242 200 256 186 256 96 Z" 
          fill="url(#starGrad)" />
  </g>

  <!-- Secondary mini-sparkle -->
  <path d="M 336 296 
           C 336 332 344 340 380 340 
           C 344 340 336 348 336 384 
           C 336 348 328 340 292 340 
           C 328 340 336 332 336 296 Z" 
        fill="url(#accentGrad)" opacity="0.95"/>
</svg>
